$schema: https://projectfile.org/schema/v1.json
kind: SoftwareSourceCode

identity:
  namespace: gg.unsigned
  name: ls
  version: "0.1.0"
  title:
    en: "ls"
  summary:
    en: "LeanSpec parser, validator, and CAS-aware Projectfile v1 normative engine."
  created: "2026-10-01"
  modified: "2026-10-13"

repositories:
  - url: "https://github.com/unsigned-gg/lsc.git"
    type: git
    branch: main
    role: origin

links:
  - type: source-code
    url: https://github.com/unsigned-gg/lsc
  - type: bugs
    url: https://github.com/unsigned-gg/lsc/issues
  - type: specification
    url: https://www.lean-spec.dev/
    label:
      en: "LeanSpec, the spec methodology lsc's format builds on"

license:
  spdx: Apache-2.0 OR MIT
  file: LICENSE-APACHE

copyright:
  year: 2026

people:
  - family-names: Todie
    given-names: Christian M.
    email: chris@todie.io
    roles: [founder, author, maintainer, copyright]

organizations:
  - name: "Unsigned"
    url: https://github.com/unsigned-gg
    roles: [funder, copyright]

keywords:
  - leanspec
  - projectfile
  - cas
  - ears
  - rust

technologies:
  - rust
  - serde
  - clap
  - blake3

requirements:
  runtime:
    rust: ">=1.85"

org:
  projectfile:
    operating-system: [ linux ]
    architecture: [ amd64 ]
    ci:
      # Stage order is the DAG order: a node runs after every node it needs. Tools inside one
      # node run in name order, so a stage that must come earlier gets its own node.
      nodes:
        toolchain:
          needs:
            toolchain-check: true
        hygiene:
          needs:
            toolchain: true
            projectfile-check: true
            spec-check: true
            stages-check: true
            zero-io-domain: true
        formatted:
          needs:
            hygiene: true
            cargo-fmt: true
        linted:
          needs:
            formatted: true
            cargo-clippy: true
        tested:
          needs:
            linted: true
            cargo-test: true
        check:
          goal: true
          needs:
            tested: true
            cargo-doc-test: true
