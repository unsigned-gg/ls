name: Prewarm

# Fill the sccache store from main so pull requests start from warm compiles.
# Caches written on main are readable by every PR branch; caches written on a PR branch
# are not. GitHub evicts caches unused for 7 days, so a schedule keeps the store warm.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/prewarm.yml'
  schedule:
    - cron: '17 5 */5 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prewarm
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  prewarm:
    name: prewarm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl
      - uses: mozilla-actions/sccache-action@v0.0.9
      # Same cargo invocations as ci.yml and package.yml, so the cache keys match.
      - name: check
        run: cargo check --workspace --all-targets -j 2
      - name: clippy
        run: cargo clippy --workspace --all-targets -j 2 -- -D warnings
      - name: test build
        run: cargo test --workspace --no-run -j 2
      - name: musl release build
        run: cargo build --release -j 2 -p ls --target x86_64-unknown-linux-musl
      - name: sccache stats
        run: sccache --show-stats
