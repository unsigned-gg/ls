# Cargo.toml for ls (LeanSpec Parser & CAS Listing Engine)
# Host Throttling: Physical host ceres runs multiple active agent sessions.
# All cargo invocations (in the Makefile, `cargo xtask`, scripts, and interactive runs)
# MUST specify -j 2 to prevent memory exhaustion and CPU starvation.

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.85"
publish = false
license = "Apache-2.0 OR MIT"
authors = ["Christian M. Todie <chris@todie.io>"]
repository = "https://github.com/unsigned-gg/ls"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1"
blake3 = { version = "1.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

